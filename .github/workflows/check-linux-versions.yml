name: check linux versions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-linux-versions
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump outdated packages
        run: python3 tools/update-linux-versions.py --write

      - name: Commit, push and tag
        run: |
          git status --porcelain -- 'linux-*/PKGBUILD' | grep -q . || { echo "all packages up to date"; exit 0; }
          NEWVER="$(grep -m1 '^pkgver=' linux-*/PKGBUILD | head -n1 | cut -d= -f2)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'linux-*/PKGBUILD'
          git commit -m "chore: bump linux packages to $NEWVER"
          git push
          for dir in linux-*/; do
            base="$(bash -c "source \"${dir}PKGBUILD\"; printf '%s' \"\$pkgbase\"")"
            tag="$base-$NEWVER-build0"
            if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
              echo "tag $tag already exists, skipping"
            else
              git tag "$tag"
            fi
          done
          git push origin --tags
