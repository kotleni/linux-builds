name: Build and release Linux kernel

on:
  push:
  workflow_dispatch:

concurrency:
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev dwarves \
            zstd xz-utils cpio kmod curl ca-certificates clang libclang-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable \
              --component rust-src --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install --locked bindgen-cli
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz"
          mkdir -p /tmp/nfpm-dist
          tar -xzf /tmp/nfpm.tar.gz -C /tmp/nfpm-dist nfpm
          sudo install -m 0755 /tmp/nfpm-dist/nfpm /usr/local/bin/nfpm

      - name: Fetch kernel source and prepare config
        id: prepare
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          upstream="$(awk '/^# Linux\/x86 / {sub(/-.*/, "", $3); print $3; exit}' config)"
          echo "Upstream kernel: $upstream"
          curl -fsSL -o "linux-${upstream}.tar.xz" \
            "https://cdn.kernel.org/pub/linux/kernel/v${upstream%%.*}.x/linux-${upstream}.tar.xz"
          tar -xf "linux-${upstream}.tar.xz"
          srcdir="$GITHUB_WORKSPACE/linux-${upstream}"
          cp "$GITHUB_WORKSPACE/config" "$srcdir/.config"
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-arch1"/' "$srcdir/.config"
          cd "$srcdir"
          make olddefconfig
          kver="$(make kernelrelease)"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "srcdir=$srcdir" >> "$GITHUB_OUTPUT"
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "tag=linux-${kver}-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          built_at="$(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "title=Linux ${kver} (${built_at})" >> "$GITHUB_OUTPUT"

      - name: Build kernel and modules
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "${{ steps.prepare.outputs.srcdir }}"
          make -j"$(nproc)"
          make INSTALL_MOD_PATH="$GITHUB_WORKSPACE/rootfs" modules_install

      - name: Stage kernel files
        run: |
          set -euo pipefail
          kver="${{ steps.prepare.outputs.kver }}"
          srcdir="${{ steps.prepare.outputs.srcdir }}"
          rootfs="$GITHUB_WORKSPACE/rootfs"
          mkdir -p "$rootfs/boot"
          install -m 0644 "$srcdir/arch/x86/boot/bzImage" "$rootfs/boot/vmlinuz-$kver"
          install -m 0644 "$srcdir/System.map" "$rootfs/boot/System.map-$kver"
          install -m 0644 "$srcdir/.config" "$rootfs/boot/config-$kver"
          rm -f "$rootfs/lib/modules/$kver/build" "$rootfs/lib/modules/$kver/source"

      - name: Build packages
        run: |
          set -euo pipefail
          kver="${{ steps.prepare.outputs.kver }}"
          srcdir="${{ steps.prepare.outputs.srcdir }}"
          version="${kver%%-*}"
          rootfs="$GITHUB_WORKSPACE/rootfs"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          cat > "$GITHUB_WORKSPACE/postinstall.sh" <<EOF
          #!/bin/sh
          if command -v depmod >/dev/null 2>&1; then
            depmod -a "${kver}" || true
          fi
          EOF
          chmod 0755 "$GITHUB_WORKSPACE/postinstall.sh"
          for fmt in archlinux deb rpm apk; do
            case "$fmt" in
              archlinux) name="linux-arch" ;;
              deb) name="linux-ubuntu" ;;
              rpm) name="linux-rpm" ;;
              apk) name="linux-alpine" ;;
            esac
            cat > "$GITHUB_WORKSPACE/nfpm-${fmt}.yaml" <<EOF
          name: ${name}
          arch: amd64
          platform: linux
          version: ${version}
          version_schema: none
          release: 1
          maintainer: Kernel Builder <builder@example.com>
          description: Linux kernel ${kver} built from the repository config
          homepage: https://www.kernel.org/
          license: GPL-2.0
          umask: 0o022
          scripts:
            postinstall: ${GITHUB_WORKSPACE}/postinstall.sh
          contents:
            - src: ${rootfs}/boot/
              dst: /boot
              type: tree
            - src: ${rootfs}/lib/modules/
              dst: /lib/modules
              type: tree
            - src: ${srcdir}/COPYING
              dst: /usr/share/licenses/${name}/COPYING
              type: license
          EOF
            nfpm package --config "$GITHUB_WORKSPACE/nfpm-${fmt}.yaml" \
              --packager "$fmt" --target "$dist"
          done
          (cd "$dist" && sha256sum * > SHA256SUMS)
          cat > "$GITHUB_WORKSPACE/release-notes.md" <<EOF
          # Linux ${kver}

          Built from the checked-in Arch Linux kernel config.

          Packages: Arch Linux (.pkg.tar.zst), Ubuntu (.deb), RPM (.rpm), Alpine (.apk).
          EOF

      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          tag: ${{ steps.prepare.outputs.tag }}
          sha: ${{ forgejo.sha }}
          title: ${{ steps.prepare.outputs.title }}
          release-dir: dist
          release-notes-file: release-notes.md
          override: 'true'
